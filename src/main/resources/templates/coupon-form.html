<!doctype html><html lang="hu" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajánlat szerkesztése | KuponRendszer</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<nav class="nav-top"><div class="container"><a class="brand" th:href="@{/admin/coupons}">✦ KuponRendszer</a></div></nav>
<main class="container form-wrap"><a class="back-link" th:href="@{/admin/coupons}">← Vissza az adminfelületre</a><div class="form-card"><span class="eyebrow">ADMINISZTRÁCIÓ</span><h1 th:text="${editing} ? 'Kupon módosítása' : 'Új kedvezmény létrehozása'">Új kupon</h1><p class="text-muted">A létrehozott kupon minden felhasználó számára elérhető lesz, amíg le nem jár.</p>
<form th:action="${editing} ? @{/admin/coupons/{id}/edit(id=${couponId})} : @{/admin/coupons}" th:object="${offerForm}" method="post">
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="brand">Márka neve</label><input id="brand" class="form-control" th:field="*{brand}" required maxlength="80" placeholder="Campus Café"><div class="text-danger small" th:errors="*{brand}"></div></div><div class="col-md-6 mb-3"><label for="title" class="form-label">Kedvezmény címe</label><input id="title" class="form-control" th:field="*{title}" required maxlength="90" placeholder="20% kedvezmény"><div class="text-danger small" th:errors="*{title}"></div></div></div>
<div class="mb-3"><label class="form-label" for="description">Rövid leírás</label><input id="description" class="form-control" th:field="*{description}" required maxlength="160" placeholder="Minden kávéra"><div class="text-danger small" th:errors="*{description}"></div></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="code">Aktiválás után látható kuponkód</label><input id="code" class="form-control" th:field="*{code}" required maxlength="50" placeholder="CAFE20"><div class="text-danger small" th:errors="*{code}"></div></div><div class="col-md-6 mb-3"><label class="form-label" for="expiryDate">Lejárat</label><input id="expiryDate" class="form-control" type="date" th:field="*{expiryDate}" required><div class="text-danger small" th:errors="*{expiryDate}"></div></div></div>
<div class="mb-4"><label for="category" class="form-label">Kategória</label><select id="category" class="form-select" th:field="*{category}"><option value="Ruházat">Ruházat</option><option value="Szállítás">Szállítás</option><option value="Elektronika">Elektronika</option><option value="Vendéglátás">Vendéglátás</option><option value="Tanulás">Tanulás</option><option value="Sport">Sport</option><option value="Vásárlás">Vásárlás</option><option value="Egyéb">Egyéb</option></select></div>
<button type="submit" class="btn btn-accent" th:text="${editing} ? 'Módosítás mentése' : 'Közzététel'">Közzététel</button><a class="btn btn-outline-secondary ms-2" th:href="@{/admin/coupons}">Mégse</a></form></div></main></body></html>
