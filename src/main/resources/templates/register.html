<!DOCTYPE html><html lang="hu" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regisztráció | KuponRendszer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><nav class="nav-top"><div class="container"><a th:href="@{/}" class="brand">♧ KuponRendszer</a></div></nav>
<main class="container auth-wrap"><div class="auth-card shadow-sm"><div class="auth-icon">✨</div><h1>Új fiók létrehozása</h1><p class="text-muted">Regisztrálj a saját kuponjaid kezeléséhez.</p>
<form th:action="@{/register}" th:object="${registerForm}" method="post">
<div class="mb-3"><label class="form-label" for="name">Név</label><input id="name" type="text" class="form-control" th:field="*{name}" required maxlength="80"><div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small"></div></div>
<div class="mb-3"><label class="form-label" for="email">E-mail-cím</label><input id="email" type="email" class="form-control" th:field="*{email}" required maxlength="160"><div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small"></div></div>
<div class="mb-4"><label class="form-label" for="password">Jelszó (legalább 8 karakter)</label><input id="password" type="password" class="form-control" th:field="*{password}" required minlength="8" maxlength="100" autocomplete="new-password"><div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small"></div></div>
<button type="submit" class="btn btn-accent w-100">Regisztráció</button></form>
<p class="text-center mt-4 mb-0">Van fiókod? <a th:href="@{/login}">Bejelentkezés</a></p></div></main></body></html>
